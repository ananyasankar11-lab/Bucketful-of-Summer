<!DOCTYPE html>
<html>

<head>
  <title>Start Your Bucket</title>

  <link rel="stylesheet" href="style.css" />

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>

<body>

  <h1>Start your bucket!</h1>

  <p>Make a group for your summer memories 💗</p>

  <button onclick="window.location.href='groups.html'">
    Create a New Group
  </button>

  <h2>Your Summer Groups</h2>

  <div id="groupGallery"></div>

  <p id="statusMessage"></p>


  <script>

    const SUPABASE_URL =
      "https://shazsdptrpegwihwqvif.supabase.co";

    const SUPABASE_ANON_KEY =
      "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InNoYXpzZHB0cnBlZ3dpaHdxdmlmIiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODgwMTg5NDQsImV4cCI6MjEwMzU5NDk0NH0.lpsslUxI-cb19MTU4fhh0E3AhictEX7RpY-RgQLH1NQ";

    const supabaseClient =
      supabase.createClient(
        SUPABASE_URL,
        SUPABASE_ANON_KEY
      );


    const groupGallery =
      document.getElementById("groupGallery");

    const statusMessage =
      document.getElementById("statusMessage");


    async function loadGroups() {

      const result =
        await supabaseClient
          .from("summer_groups")
          .select("*")
          .order("created_at", {
            ascending: false
          });


      if (result.error) {

  console.error("CREATE GROUP ERROR:", result.error);

  document.getElementById(
    "statusMessage"
  ).textContent =
    "Error: " + result.error.message;

  return;
}


      groupGallery.innerHTML = "";


      result.data.forEach(function (group) {

        const groupCard =
          document.createElement("div");

        groupCard.className =
          "group-card";


        const title =
          document.createElement("h3");

        title.textContent =
          group.name;


        const description =
          document.createElement("p");

        description.textContent =
          group.description || "";


        const privacy =
          document.createElement("p");

        privacy.textContent =
          group.is_public
            ? "🌎 Public"
            : "🔒 Private";


        const openButton =
          document.createElement("button");

        openButton.textContent =
          "Open Group";


        openButton.onclick = function () {

          window.location.href =
            "group.html?id=" + group.id;

        };


        groupCard.appendChild(title);

        groupCard.appendChild(description);

        groupCard.appendChild(privacy);

        groupCard.appendChild(openButton);


        groupGallery.appendChild(groupCard);

      });

    }


    loadGroups();

  </script>
</body>

</html>
