<!DOCTYPE html>
<html>

<head>
    <title>Create Bucket</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="create-box">

        <h1>Create a Bucket </h1>

        <input
            id="groupName"
            type="text"
            placeholder="Bucket name"
        >

        <textarea
            id="description"
            placeholder="What's this bucket about?"
        ></textarea>

        <h3>Who can see it?</h3>

        <label>
            <input
                type="radio"
                name="visibility"
                value="public"
                checked
            >
            Public
        </label>

        <label>
            <input
                type="radio"
                name="visibility"
                value="private"
            >
            Private
        </label>

        <button id="createBtn">
            Create Bucket
        </button>

        <p id="message"></p>

    </div>

    <script type="module" src="js/groups.js"></script>

</body>
</html>
